# RTP Stream Analyzer Nginx 反代配置（多个域名共用本服务、共用一张 HTTPS 证书）
#
# 上手步骤（顺序很重要：先签证书，再放本配置，否则 nginx -t 过不去）：
#   1. 把两处 server_name 换成你的全部域名（空格分隔），DNS 解析到本服务器
#   2. 签多域名共用证书（acme.sh，所有 -d 签进同一张；第一个 -d 是主域名）：
#      ~/.acme.sh/acme.sh --issue --server letsencrypt --nginx \
#        -d 主域名 -d 域名2 -d 域名3 -d 域名4
#   3. 把共用证书安装到固定路径（本服务和其他服务都引用这一份）：
#      ~/.acme.sh/acme.sh --install-cert -d 主域名 \
#        --fullchain-file /etc/nginx/ssl/shared.fullchain.pem \
#        --key-file       /etc/nginx/ssl/shared.key.pem \
#        --reloadcmd      "nginx -s reload"
#      以后自动续期后会执行 reloadcmd，所有引用该文件的服务一起更新。
#      （如安装路径与下面 ssl_certificate 不一致，改下面两行即可）
#   4. 拷到服务器并重载：
#      scp deploy/nginx-rtp-stream-analyzer.conf root@服务器IP:/etc/nginx/conf.d/
#      nginx -t && systemctl reload nginx

# HTTP 一律跳转 HTTPS
server {
    listen 80;
    server_name rtp-analyzer.cn rtp-analyzer.com rtp-analyzer.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rtp-analyzer.cn rtp-analyzer.com rtp-analyzer.site;

    # 共用证书：acme.sh --install-cert 安装的固定路径（见文件头第 3 步）
    ssl_certificate     /etc/nginx/ssl/shared.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/shared.key.pem;

    # 抓包文件最大 500MB，Nginx 默认只收 1MB，不放宽会直接 413
    client_max_body_size 600m;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传 + 分析耗时长，读写超时放宽到 5 分钟（与 gunicorn 超时一致）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 500MB 上传不落盘缓冲，边收边转发给后端
        proxy_request_buffering off;
    }
}
