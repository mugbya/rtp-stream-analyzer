{% extends "base.html" %}
{% block title %}RTP Analyzer - Results{% endblock %}

{% block content %}
<div class="page-results">
    <div class="page-head">
        <h2><i class="bi bi-clipboard-data"></i> 分析结果</h2>
        <a href="/" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left"></i> 返回首页
        </a>
    </div>

        <div id="result-loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">正在加载分析结果...</p>
        </div>

        <div id="result-content" class="d-none">
            <!-- 多通通话切换提示（检测到 ≥2 通时显示） -->
            <div id="call-switch-banner" class="d-none mb-4"></div>

            <!-- 追加分析提示（会话里还有未分析的媒体类型时显示） -->
            <div id="media-switch-banner" class="d-none mb-4"></div>

            <!-- 摘要卡片 -->
            <div class="row g-3 mb-4" id="summary-cards"></div>

            <!-- 通话与 SIP 信令 -->
            <div class="card mb-4 d-none" id="calls-card">
                <div class="card-header bg-success">
                    <h5 class="mb-0"><i class="bi bi-telephone"></i> 通话与 SIP 信令</h5>
                </div>
                <div class="card-body" id="calls-container"></div>
            </div>

            <!-- 音视频回放 -->
            <div class="card mb-4 d-none" id="media-card">
                <div class="card-header bg-purple">
                    <h5 class="mb-0"><i class="bi bi-collection-play"></i> 音视频回放</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted small mb-3">
                        从 RTP 流重建的音频/视频，按链路方向分组（点对点通话媒体不经服务端）。
                        每条流的<strong>质量结论与问题</strong>直接挂在对应播放器下面：严重的默认展开，注意/提示级点击展开。
                    </p>
                    <div id="media-container"></div>
                </div>
            </div>

            <!-- 详细报告 -->
            <div class="card mb-4">
                <div class="card-header bg-secondary">
                    <h5 class="mb-0"><i class="bi bi-file-text"></i> 详细报告</h5>
                </div>
                <div class="card-body" id="detail-report"></div>
            </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const SESSION_ID = '{{ session_id }}';

document.addEventListener('DOMContentLoaded', () => {
    fetch(`/api/session/${SESSION_ID}`)
        .then(r => r.json())
        .then(data => {
            if (data.results) {
                showResults(data.results);
                // 追加分析提示：会话里还有本次没分析的媒体类型时展示切换按钮
                renderMediaSwitcher(data, data.results);
                if (data.calls && data.calls.length) {
                    buildIpRoleMap(data.files || [], data.server_ip);
                    renderCalls(data.calls, data.capture_warning, data.files || []);
                    renderCallSwitcher(data.calls, data.results.call_id, data.results,
                                       data.files || []);
                }
                // 抓包完整性提醒（截短包/文件尾损坏）：无通话也展示
                const integrityHtml = _integrityWarningHtml(data.files);
                if (integrityHtml) {
                    document.getElementById('calls-card').classList.remove('d-none');
                    document.getElementById('calls-container')
                        .insertAdjacentHTML('beforeend', integrityHtml);
                }
            } else {
                document.getElementById('result-loading').innerHTML =
                    '<p class="text-warning">No results found for this session.</p>';
            }
        })
        .catch(err => {
            document.getElementById('result-loading').innerHTML =
                '<p class="text-danger">Failed to load results: ' + err.message + '</p>';
        });
});

function showResults(results) {
    document.getElementById('result-loading').classList.add('d-none');
    document.getElementById('result-content').classList.remove('d-none');

    // 摘要卡片
    const summary = results.summary;
    const cards = document.getElementById('summary-cards');
    const statCard = (icon, title, value, sub, color) => `
        <div class="col-6 col-xl-3">
            <div class="stat-card stat-${color}">
                <div class="stat-icon"><i class="bi ${icon}"></i></div>
                <div>
                    <div class="stat-title">${title}</div>
                    <div class="stat-value">${value}</div>
                    ${sub ? `<div class="stat-sub">${sub}</div>` : ''}
                </div>
            </div>
        </div>`;
    const overallMeta = {
        healthy: ['bi-heart-pulse', '健康', 'success'],
        warning: ['bi-exclamation-triangle', '注意', 'warning'],
        error:   ['bi-x-octagon', '异常', 'danger'],
    }[summary.overall] || ['bi-x-octagon', '异常', 'danger'];
    cards.innerHTML =
        (summary.fs_delay_mean != null
            ? statCard('bi-speedometer2', '服务端内部延迟',
                       `${summary.fs_delay_mean.toFixed(1)}<span class="stat-unit">ms</span>`,
                       `P95 ${summary.fs_delay_p95.toFixed(1)}ms`, 'primary')
            : statCard('bi-speedometer2', '服务端内部延迟', '未测量',
                       summary.delay_checked === false ? '未勾选延迟分析' : '缺少服务端抓包',
                       'secondary')) +
        statCard('bi-activity', '抖动流数', summary.jitter_streams, '已分析', 'success') +
        statCard(summary.packet_loss_clean ? 'bi-shield-check' : 'bi-shield-x',
                 '丢包状态', summary.packet_loss_clean ? '无丢包' : '有丢包', '',
                 summary.packet_loss_clean ? 'success' : 'danger') +
        statCard('bi-clock-history', '时间戳',
                 summary.ts_clean === false ? '异常' : '连续', '',
                 summary.ts_clean === false ? 'warning' : 'success') +
        (summary.media_quality && summary.media_quality.checked
            ? statCard(summary.media_quality.clean ? 'bi-music-note-beamed' : 'bi-exclamation-diamond',
                       '音画质量', summary.media_quality.clean ? '正常' : '有异常',
                       '杂音/啸叫/花屏检测',
                       summary.media_quality.clean ? 'success' : 'danger')
            : '') +
        statCard(overallMeta[0], '综合评估', overallMeta[1], '', overallMeta[2]);
    
    // 详细报告
    const report = results.report;
    if (report) {
        const detail = document.getElementById('detail-report');
        let html = '';
        
        if (report.delay && report.delay.fs_internal && report.delay.fs_internal.available) {
            html += '<h6>服务端内部处理延迟</h6>';
            const d = report.delay.fs_internal;
            const cells = [
                ['均值', d.mean], ['P50', d.p50], ['P95', d.p95], ['P99', d.p99],
                ['最大', d.max], ['标准差', d.std], ['样本数', d.count],
                ['尖峰 >50ms', d.outliers_50ms], ['尖峰 >100ms', d.outliers_100ms],
            ];
            html += '<table class="table table-sm table-bordered"><tr>';
            cells.forEach(([k, v], i) => {
                html += `<th>${k}</th><td>${typeof v === 'number' ? v.toFixed(2) : v}</td>`;
                if (i % 4 === 3) html += '</tr><tr>';
            });
            html += '</tr></table>';
        }
        
        // 无声诊断 / 分段延迟链路：当回放区音频方向卡已经按方向展示结论时，
        // 明细并入卡内折叠区，这里不再整段重复（避免同一条链路头出现多次）
        const _audioEntries = (results.media_manifest && results.media_manifest.audio) || [];
        const _ahDirs = (report.audio_health && report.audio_health.directions) || [];
        const _dcDirs = (report.delay_chains && report.delay_chains.directions) || [];
        const _audioDirMerged = _audioEntries.length > 0 && (_ahDirs.length > 0 || _dcDirs.length > 0);
        if (report.audio_health) {
            html += renderAudioHealth(report.audio_health, _audioDirMerged);
        }

        // 分段延迟链路：每个方向拆成三段测量，定位延迟在哪一段
        if (report.delay_chains) {
            html += renderDelayChains(report.delay_chains, _audioDirMerged);
        }

        if (report.conclusion) {
            html += '<h6>结论</h6>';
            html += `<p><strong>${_esc(report.conclusion.root_cause)}</strong></p>`;
            if (report.conclusion.issues && report.conclusion.issues.length > 0) {
                html += '<ul class="list-group mb-3">';
                report.conclusion.issues.forEach(i => {
                    const sev = i.severity === 'critical' ? 'danger' : i.severity === 'warning' ? 'warning' : 'info';
                    const streamData = i.stream && report.timestamp_continuity &&
                        report.timestamp_continuity.streams[i.stream];
                    const hasEvents = !!(streamData && streamData.events && streamData.events.length);
                    html += `<li class="list-group-item list-group-item-${sev}">`;
                    if (hasEvents) {
                        html += `<div class="issue-clickable" onclick="toggleIssueDetail(this)" title="点击展开/收起逐包明细">` +
                                `<i class="bi bi-chevron-right issue-chevron"></i>${_esc(i.message)}</div>`;
                    } else {
                        html += _esc(i.message);
                    }
                    if (i.explain) html += `<div class="issue-explain">${_esc(i.explain).replace(/\n/g, '<br>')}</div>`;
                    if (hasEvents) html += `<div class="issue-detail d-none">${renderTsEventTable(streamData)}</div>`;
                    html += '</li>';
                });
                html += '</ul>';
            }
            if (report.conclusion.ok_items && report.conclusion.ok_items.length > 0) {
                html += '<h6 class="mt-3">正常项</h6><ul class="list-group mb-3">';
                report.conclusion.ok_items.forEach(item => {
                    html += `<li class="list-group-item list-group-item-success">✓ ${_esc(item)}</li>`;
                });
                html += '</ul>';
            }
        }

        // 音频/视频问题展示：回放区有媒体时问题挂在各播放器卡片下（见
        // showMedia）；回放区没有可展示的媒体时在这里兜底，避免问题没地方看
        if (!_hasMediaEntries(results.media_manifest)) {
            html += renderMediaSections(report);
        }

        // RTCP 收发报告：接收端视角的丢包/抖动佐证
        if (report.rtcp) {
            html += renderRtcp(report.rtcp);
        }

        detail.innerHTML = html;
    }
    
    // 音视频回放（质量结论与问题直接挂在各播放器卡片下）
    if (results.media_manifest) {
        showMedia(results.media_manifest, report);
    }
}

// 回放区是否有可展示的媒体条目（含未能重建的流）
function _hasMediaEntries(manifest) {
    return !!(manifest &&
        ((manifest.audio || []).length +
         (manifest.video || []).length +
         (manifest.unsupported || []).length));
}

// ====== 时间戳异常逐包明细（点击 issue 展开"前后相关内容"）======
// 现象的直白名称（kind 来自 ts_continuity 检测器）
const TS_KIND_TXT = {
    ts_jump: '声音断开',
    ts_backward: '时间倒退',
    reorder: '包晚到(乱序)',
    duplicate: '声音重复',
};

// 切换某条 issue 的逐包明细展开/收起，箭头随之转向
function toggleIssueDetail(headEl) {
    const li = headEl.closest('li');
    const detail = li.querySelector('.issue-detail');
    if (!detail) return;
    detail.classList.toggle('d-none');
    const chevron = headEl.querySelector('.issue-chevron');
    if (chevron) chevron.classList.toggle('open');
}

function renderTsEventTable(streamData) {
    // 时间戳增量换算成毫秒（音频流有时钟率；视频等 frame 模式只有 ts 单位）。
    // 发送端中途重置时间戳基准时增量会是天文数字，直接罗列没有意义，按幅度归为
    // "大幅跳变/倒退"
    const rate = streamData.clock_rate;
    const deltaTxt = ev => {
        if (ev.ts_delta === undefined || ev.ts_delta === null) return '—';
        if (!rate) return `${ev.ts_delta} (ts)`;
        const ms = ev.ts_delta / rate * 1000;
        if (Math.abs(ms) >= 60000) return ms > 0 ? '大幅跳变' : '大幅倒退';
        return `${ms.toFixed(0)}ms`;
    };
    const gapTxt = ev => (ev.media_gap_ms === null || ev.media_gap_ms === undefined)
        ? '—' : `${ev.media_gap_ms}ms`;
    let rows = '';
    streamData.events.forEach(ev => {
        rows += `<tr>` +
            `<td class="text-nowrap">${ev.time_str}</td>` +
            `<td>${TS_KIND_TXT[ev.kind] || ev.kind}</td>` +
            `<td class="text-nowrap">#${ev.prev_seq ?? '—'} / ${ev.prev_ts ?? '—'}</td>` +
            `<td class="text-nowrap">#${ev.seq} / ${ev.ts ?? '—'}</td>` +
            `<td>${deltaTxt(ev)}</td>` +
            `<td>${gapTxt(ev)}</td>` +
            `</tr>`;
    });
    const truncated = streamData.event_count > streamData.events.length
        ? `<div class="text-muted small mb-1">仅列出前 ${streamData.events.length} 处（本流共 ${streamData.event_count} 处），完整计数见上方文字。</div>`
        : '';
    return `${truncated}` +
        `<div class="table-responsive"><table class="table table-sm table-bordered issue-table mb-0">` +
        `<thead><tr><th>时间</th><th>现象</th><th>前一个包 seq / 时间戳</th>` +
        `<th>本包 seq / 时间戳</th><th>时间戳增量</th><th>缺失声音</th></tr></thead>` +
        `<tbody>${rows}</tbody></table></div>`;
}

// ====== 无声诊断 / 分段延迟链路 / RTCP 展示 ======

// 方向/链路状态徽章（verdict → [Bootstrap 色, 中文]）
const HEALTH_BADGES = {
    ok: ['success', '正常'],
    blocked: ['danger', '媒体断裂'],
    no_source: ['danger', '无媒体'],
    silent_source: ['danger', '发出即静音'],
    silent_path: ['danger', '途中变静音'],
    unknown: ['secondary', '无法判定'],
    high: ['warning', '偏高'],
    partial: ['secondary', '部分可测'],
    unavailable: ['secondary', '不可测'],
};

function _healthBadge(verdict) {
    const [cls, txt] = HEALTH_BADGES[verdict] || ['secondary', verdict];
    return `<span class="badge bg-${cls}">${_esc(txt)}</span>`;
}

// 无声诊断逐腿明细（独立区块与音频方向卡内折叠明细共用）
function _audioLegsHtml(d) {
    let html = '';
    (d.legs || []).forEach(l => {
        const p = l.presence || {};
        const pres = [
            p.sent_at_source === true ? '源端已发' :
                p.sent_at_source === false ? '源端未见' : '源端未观测',
            p.arrived_at_next === true ? '下一跳已收' :
                p.arrived_at_next === false ? '下一跳未见' : '下一跳未观测',
        ].join(' · ');
        html += `<div class="ms-3 mt-1 small border-start ps-2">` +
            `${_healthBadge(l.status)} <strong>${_esc(l.leg)}</strong> ` +
            `<span class="text-muted">(${l.ssrc || '—'}；${pres})</span>` +
            (l.note ? `<div class="mt-1">${_esc(l.note)}</div>` : '') +
            `</div>`;
    });
    return html;
}

function renderAudioHealth(h, merged) {
    // 已合并进回放区音频方向卡：链路头与逐腿明细都在卡里，不再整段重复
    if (merged) return '';
    let html = '<h6 class="mt-3">无声诊断（谁没听到谁的声音）</h6>';
    if (!h.directions || !h.directions.length) {
        return html + `<p class="text-muted small mb-3">${_esc(h.summary || '数据不足，无法做无声诊断')}</p>`;
    }
    // 点对点通话链路里没有 FS，方向头与腿名都不再带 FS
    const p2p = h.p2p || _p2pFallback(h.directions);
    html += `<p class="small text-muted mb-2">按方向逐腿检查"${p2p ? '发声端 → 听者' : '发声端 → 服务端 → 听者'}"：流是否发出、是否到达、内容是否有人声，用于定位"没听到声音"。</p>`;
    h.directions.forEach(d => {
        html += `<div class="border rounded p-2 mb-2">` +
            `<div class="d-flex flex-wrap align-items-center gap-2">` +
            _chainHtml(d.speaker, d.listener, p2p) +
            _healthBadge(d.verdict) +
            `<span class="small">${_esc(d.verdict_text)}</span></div>`;
        html += _audioLegsHtml(d);
        html += '</div>';
    });
    if (h.summary) html += `<p class="small text-muted mb-0 mt-1">${_esc(h.summary)}</p>`;
    return html;
}

// 分段延迟链路单方向的分段测量表（独立区块与音频方向卡内折叠明细共用）
function _delayTableHtml(d) {
    let html = '<div class="table-responsive"><table class="table table-sm table-bordered mb-0 mt-1">' +
        '<thead><tr><th>段</th><th>SSRC</th><th>均值</th><th>P50</th><th>P95</th>' +
        '<th>样本</th><th>时钟差</th><th>状态</th></tr></thead><tbody>';
    (d.segments || []).forEach(s => {
        const num = v => (v != null && typeof v === 'number') ? v.toFixed(1) : '—';
        html += `<tr><td class="text-nowrap">${_esc(s.name)}</td>` +
            `<td class="text-nowrap">${_esc(s.ssrc || '—')}</td>` +
            `<td>${s.mean != null ? num(s.mean) + 'ms' : '—'}</td>` +
            `<td>${num(s.p50)}</td><td>${num(s.p95)}</td>` +
            `<td>${s.count || '—'}</td>` +
            `<td>${s.clock_offset_ms != null ? s.clock_offset_ms.toFixed(0) + 'ms' : '—'}</td>` +
            `<td>${s.available ? _healthBadge(s.status) :
                '<span class="badge bg-secondary">未测到</span>'}</td></tr>`;
        if (s.note) {
            html += `<tr class="table-light"><td colspan="8" class="small text-muted">${_esc(s.note)}</td></tr>`;
        }
    });
    html += '</tbody></table></div>';
    return html;
}

function renderDelayChains(dc, merged) {
    // 已合并进回放区音频方向卡：方向行（链路头+分段表）都在卡里，
    // 这里只保留不分方向的往返参考与备注
    if (merged) {
        let html = '';
        if (dc.roundtrip && dc.roundtrip.length) {
            html += '<div class="small mt-2"><strong>往返参考（已抵消时钟差）：</strong>';
            dc.roundtrip.forEach(r => {
                html += `<span class="badge ${r.status === 'high' ? 'bg-warning text-dark' : 'bg-success'} me-1">` +
                    `${_esc(r.pair)} ${r.ms}ms</span>`;
            });
            html += '</div>';
        }
        (dc.notes || []).forEach(n => {
            html += `<div class="text-muted small mt-1">${_esc(n)}</div>`;
        });
        return html;
    }
    let html = '<h6 class="mt-3">分段延迟链路（延迟在哪一段）</h6>';
    if (!dc.directions || !dc.directions.length) {
        const note = (dc.notes && dc.notes[0]) || '数据不足，无法测量链路延迟';
        return html + `<p class="text-muted small mb-3">${_esc(note)}</p>`;
    }
    // 点对点通话链路只有一段网络路径，方向头不带 FS
    const p2p = dc.p2p || (dc.directions || []).some(d =>
        (d.segments || []).some(s => (s.name || '').includes('直连')));
    html += `<p class="small text-muted mb-2">把每个方向拆成 ${p2p ? '发声端 → 听者 一段' : '发声端→服务端、服务端内部、服务端→听者 三段'}测量。` +
        `跨抓包段包含抓包机时钟差，绝对值仅供参考；两段往返之和可抵消时钟差。</p>`;
    dc.directions.forEach(d => {
        html += `<div class="border rounded p-2 mb-2">` +
            `<div class="d-flex flex-wrap align-items-center gap-2">` +
            _chainHtml(d.speaker, d.listener, p2p) +
            _healthBadge(d.verdict) +
            (d.total_mean != null
                ? `<span class="small text-muted">合计 ${d.total_mean}ms` +
                  (d.total_note ? `（${_esc(d.total_note)}）` : '') + `</span>`
                : '') +
            `</div><div class="small mt-1">${_esc(d.verdict_text)}</div>`;
        html += _delayTableHtml(d) + '</div>';
    });
    if (dc.roundtrip && dc.roundtrip.length) {
        html += '<div class="small mt-1"><strong>往返参考（已抵消时钟差）：</strong>';
        dc.roundtrip.forEach(r => {
            html += `<span class="badge ${r.status === 'high' ? 'bg-warning text-dark' : 'bg-success'} me-1">` +
                `${_esc(r.pair)} ${r.ms}ms</span>`;
        });
        html += '</div>';
    }
    (dc.notes || []).forEach(n => {
        html += `<div class="text-muted small mt-1">${_esc(n)}</div>`;
    });
    return html;
}

// ====== 流质量速览（并入声音/视频问题分类区块）======
// 原独立"音画质量分析"块与问题分类展示的是同一批检测结论，已并入避免重复。
// 音画质量专用徽章（音频 clean/noisy/bad/silent，视频 ok/risk/bad）
const QUALITY_BADGES = {
    clean: ['success', '干净'],
    noisy: ['warning', '有杂音'],
    bad: ['danger', '异常'],
    silent: ['danger', '无人声'],
    ok: ['success', '无花屏风险'],
    risk: ['warning', '花屏风险'],
};

// 音频流关键指标徽章（原每流卡片的指标行，速览复用）
function _audioQualityChips(q) {
    if (q.verdict === 'unknown') {
        return [`${q.codec || ''} 编码不可解（仅 PCMU/PCMA 支持音质检测）`];
    }
    const chips = [];
    if (q.tones?.howl_count) chips.push(`啸叫/单频音 ${q.tones.howl_count} 处`);
    if (q.tones?.prompt_count) chips.push(`提示音 ${q.tones.prompt_count} 处`);
    if (q.tones?.hum_count) chips.push(`低频嗡声 ${q.tones.hum_count} 处`);
    if (q.clipping?.run_count) chips.push(`削波 ${q.clipping.run_count} 处`);
    if (q.clicks?.count) chips.push(`爆点 ${q.clicks.count} 个`);
    if (q.noise_floor_dbfs != null) chips.push(`底噪 ${q.noise_floor_dbfs} dBFS`);
    if (q.speech_level_dbfs != null) chips.push(`话音 ${q.speech_level_dbfs} dBFS`);
    const integ = q.rtp_integrity;
    if (integ) {
        if (integ.monotonic && !integ.lost_packets && !integ.ts_duplicate) {
            chips.push(`RTP 秩序正常（每包 +${integ.median_ts_delta} ≈ ${integ.packet_duration_ms}ms）`);
        } else {
            if (integ.lost_packets) chips.push(`序号缺口 ${integ.seq_gaps} 处（丢 ${integ.lost_packets} 包）`);
            if (integ.ts_backward) chips.push(`时间戳倒退 ${integ.ts_backward} 处`);
            if (integ.ts_duplicate) chips.push(`时间戳重复 ${integ.ts_duplicate} 处`);
        }
        if (integ.other_pt_packets) chips.push(`其他PT包 ${integ.other_pt_packets} 个（DTMF 事件等，不参与秩序判定）`);
    }
    if (!chips.length) chips.push('未检测到异常');
    return chips;
}

// 视频流关键指标徽章（原每流卡片的指标行，速览复用）
function _videoQualityChips(q) {
    const chips = [];
    if (q.total_lost) chips.push(`丢包 ${q.total_lost} 包（${q.loss_rate_pct}%)`);
    if (q.rtp_integrity?.ts_backward) chips.push(`时间戳倒退 ${q.rtp_integrity.ts_backward} 处`);
    if (q.broken_nals) chips.push(`破损帧 ${q.broken_nals} 个`);
    chips.push(`IDR 关键帧 ${q.idr_count ?? 0} 个`);
    if (q.idr_interval_max_s != null) chips.push(`最长间隔 ${q.idr_interval_max_s}s`);
    if (q.est_artifacts_ms) chips.push(`估算花屏 ${(q.est_artifacts_ms / 1000).toFixed(1)}s`);
    if (q.decode_check === 'ok') chips.push('解码校验通过');
    else if (q.decode_check === 'errors') chips.push(`解码错误 ${q.decode_errors} 处`);
    else if (q.decode_check === 'unavailable') chips.push('解码校验跳过（无 ffmpeg）');
    return chips;
}

// ====== 音/视频区块：按链路方向分组，问题挂到具体流 ======
// 原"流质量速览 + 声音/视频问题分类"两个平铺区块重组为：音频/视频各一个
// 区块，区内按链路方向分组（主叫 → FS → 被叫；点对点去掉 FS），每组下流
// 卡片两列并排，问题挂在对应流卡片下——严重（critical）默认展开，注意/
// 提示级收进折叠区。旧会话数据的问题条目没有 streams/directions 字段时，
// 回退按证据文本前缀/包含关系匹配归属。

// 链路节点徽章：主叫=蓝、被叫=绿、FS=黑，其余名字深灰
function _chainNodeBadge(name) {
    const cls = name === '主叫' ? 'bg-primary'
        : name === '被叫' ? 'bg-success' : 'bg-dark';
    return `<span class="badge ${cls}">${_esc(name)}</span>`;
}

// 链路：主叫 → FS → 被叫；点对点（p2p=true）时中间的 FS 不展示
function _chainHtml(speaker, listener, p2p) {
    const arrow = '<i class="bi bi-arrow-right text-muted mx-1"></i>';
    let html = _chainNodeBadge(speaker || '主叫');
    if (!p2p) html += arrow + '<span class="badge bg-dark">服务端</span>';
    html += arrow + _chainNodeBadge(listener || '被叫');
    return `<span class="chain-line d-inline-flex align-items-center flex-wrap">${html}</span>`;
}

// 旧会话数据的 p2p 兜底：无声诊断的直连腿名带"直连"字样
function _p2pFallback(directions) {
    return (directions || []).some(d =>
        (d.legs || []).some(l => (l.leg || '').includes('直连')));
}

// 流展示标签形如 "seat (SSRC=0x00ff2b3a)"，解析角色与 SSRC
function _parseStreamLabel(label) {
    // 角色随抓包点不同：端点抓包是 caller/callee，FS 抓包是 fs；旧数据是 terminal/seat
    const m = /^(terminal|seat|fs|caller|callee)\s*\(SSRC=0x([0-9a-fA-F]+)\)/.exec(label || '');
    return m ? { role: m[1], ssrc: '0x' + m[2].toLowerCase().padStart(8, '0') }
             : { role: null, ssrc: null };
}

// 收集一个链路方向涉及的 SSRC 集合：无声诊断各腿的 ssrc + 分段延迟同方向
// 各段的 ssrc（跨段形态 '0xA → 0xB' 两头都收）。同一路媒体经 FS 时上下行
// SSRC 不同，方向归属靠这两个来源配齐
function _dirSsrcs(ahDir, dcDir) {
    const set = new Set();
    const grab = v => {
        if (!v) return;
        String(v).toLowerCase().replace(/0x[0-9a-f]+/g, h => (set.add(h), h));
    };
    ((ahDir && ahDir.legs) || []).forEach(l => grab(l.ssrc));
    ((dcDir && dcDir.segments) || []).forEach(s => grab(s.ssrc));
    return set;
}

// 从腿名取实际链路："主叫上行（主叫 → FS）" → "主叫 → FS"
function _legChainName(legName) {
    const m = /[（(](.+?)[）)]/.exec(legName || '');
    return m ? m[1].replace(/\s+/g, ' ').trim() : '';
}

// 方向组只匹配到一条腿（单侧抓包只见半程）时，返回该腿的实际链路描述
// （如"主叫 → FS"），调用方据此把链路头从完整"主叫 → FS → 被叫"改成
// 实际观测到的半程；整条方向都有流匹配时返回 null。legs 是无声诊断的腿
// （leg 名带括号链路，ssrc 可能是 '0xA → 0xB' 跨段形态）
function _singleLegChain(legs, glSsrcs) {
    const hit = l => l.ssrc && String(l.ssrc).toLowerCase().split('→')
        .some(x => glSsrcs.has(x.trim()));
    const hits = (legs || []).filter(hit);
    if ((legs || []).length < 2 || hits.length !== 1) return null;
    return _legChainName(hits[0].leg);
}

// 延迟链路版：段名本身就是链路（"主叫 → FS"），FS 内部段不算腿
function _singleLegChainFromSegments(segs, glSsrcs) {
    const hit = s => s.ssrc && String(s.ssrc).toLowerCase().split('→')
        .some(x => glSsrcs.has(x.trim()));
    const isLeg = s => (s.name || '').includes('→') && !(s.name || '').includes('内部');
    const legs = (segs || []).filter(isLeg);
    const hits = legs.filter(hit);
    if (legs.length < 2 || hits.length !== 1) return null;
    return hits[0].name;
}

// 组装链路方向分组。audio 优先以无声诊断的方向为准（缺失时退回延迟链路
// 的方向定义）；方向级检测没覆盖到的流（视频，或无声/延迟检测不可用时）
// 按每条流的真实收发双方 flow 拼链路方向——上行（端→FS）与下行（FS→对端）
// 合成"发送端 → 接收端"一个方向组；流上没有 flow 标注时最后退回按角色
// 前缀归组。labels 是流展示标签数组（回放区传播放条目、详细报告传
// media_quality 的键）；flowOf(label) 返回 {from:{label,ip}, to:{label,ip}}。
function _buildDirGroups(labels, report, kind, p2p, flowOf, serverIp) {
    const bySsrc = {};
    labels.forEach(lb => {
        const { ssrc } = _parseStreamLabel(lb);
        if (ssrc) (bySsrc[ssrc] = bySsrc[ssrc] || []).push(lb);
    });
    const groups = [];
    const used = new Set();

    const takeBySsrc = ssrcs => {
        const gl = [];
        ssrcs.forEach(s => (bySsrc[s] || []).forEach(lb => {
            if (!used.has(lb)) { used.add(lb); gl.push(lb); }
        }));
        return gl;
    };

    const ahDirs = (report.audio_health && report.audio_health.directions) || [];
    const dcDirs = (report.delay_chains && report.delay_chains.directions) || [];
    // 方向级检测的组一条流都没匹配到时不单独出空卡——否则同一条"谁到谁"
    // 链路会出现两次（一次空卡带结论、一次 flow 兜底的卡带流）。
    // 结论先存下，稍后挂到同方向的实际组头上
    const pendingVerdicts = [];
    if (ahDirs.length) {
        ahDirs.forEach(d => {
            const dc = dcDirs.find(x => x.label === d.label);
            const gl = takeBySsrc(_dirSsrcs(d, dc));
            if (!gl.length) {
                pendingVerdicts.push({ label: d.label, speaker: d.speaker, listener: d.listener,
                                       verdict: d.verdict, verdictText: d.verdict_text, ah: d, dc });
                return;
            }
            const glSsrcs = new Set(gl.map(lb => _parseStreamLabel(lb).ssrc).filter(Boolean));
            const legChain = _singleLegChain(d.legs, glSsrcs);
            if (legChain) {
                // 半程卡：只抓到这条腿，头就标实际的"谁 → 谁"（如 主叫 → FS），
                // 方向级结论是针对完整链路的，不再挂上来（明细仍在折叠区）
                const [spk, lst] = legChain.split('→').map(s => s.trim());
                groups.push({ label: legChain, speaker: spk, listener: lst,
                              legOnly: true, p2p: true, ah: d, dc, labels: gl });
            } else {
                groups.push({ label: d.label, speaker: d.speaker, listener: d.listener,
                              verdict: d.verdict, verdictText: d.verdict_text, p2p,
                              ah: d, dc, labels: gl });
            }
        });
    } else if (dcDirs.length) {
        dcDirs.forEach(d => {
            const gl = takeBySsrc(_dirSsrcs(null, d));
            if (!gl.length) {
                pendingVerdicts.push({ label: d.label, speaker: d.speaker, listener: d.listener,
                                       verdict: d.verdict, verdictText: d.verdict_text, dc: d });
                return;
            }
            const glSsrcs = new Set(gl.map(lb => _parseStreamLabel(lb).ssrc).filter(Boolean));
            const legChain = _singleLegChainFromSegments(d.segments, glSsrcs);
            if (legChain) {
                const [spk, lst] = legChain.split('→').map(s => s.trim());
                groups.push({ label: legChain, speaker: spk, listener: lst,
                              legOnly: true, p2p: true, dc: d, labels: gl });
            } else {
                groups.push({ label: d.label, speaker: d.speaker, listener: d.listener,
                              verdict: d.verdict, verdictText: d.verdict_text, p2p,
                              dc: d, labels: gl });
            }
        });
    }

    // 方向级检测没覆盖到的流：先按真实收发双方（flow）拼链路方向，
    // 拼不出（缺 flow 标注/拓扑怪异）再退回按角色前缀归组
    if (labels.some(lb => !used.has(lb)) && flowOf) {
        const fg = _flowDirGroups(labels.filter(lb => !used.has(lb)), flowOf, p2p, serverIp);
        if (fg) fg.forEach(g => {
            groups.push(g);
            g.labels.forEach(lb => used.add(lb));
        });
    }

    // 还剩的流按角色前缀归组
    [{ role: 'terminal', speaker: '主叫', listener: '被叫' },
     { role: 'seat', speaker: '被叫', listener: '主叫' },
     { role: 'caller', speaker: '主叫', listener: '被叫' },
     { role: 'callee', speaker: '被叫', listener: '主叫' }].forEach(rg => {
        const gl = labels.filter(lb => !used.has(lb) &&
            _parseStreamLabel(lb).role === rg.role);
        gl.forEach(lb => used.add(lb));
        if (gl.length) groups.push({ label: `${rg.speaker} → ${rg.listener}`,
            speaker: rg.speaker, listener: rg.listener, p2p, labels: gl });
    });
    const fsLabels = labels.filter(lb => !used.has(lb) &&
        _parseStreamLabel(lb).role === 'fs');
    if (fsLabels.length) {
        fsLabels.forEach(lb => used.add(lb));
        groups.push({ label: '', fsRelay: true, p2p: false, labels: fsLabels });
    }
    // SSRC 没配上、角色也不认识的剩余流兜底成"其他流"组
    const rest = labels.filter(lb => !used.has(lb));
    if (rest.length) groups.push({ label: '', rest: true, labels: rest });
    // 方向级检测没匹配到流的结论：挂到同"谁到谁"的组头上（无声诊断正常/
    // 异常的判定仍然可见），找不到同方向宿主组就丢弃，绝不再出空卡
    pendingVerdicts.forEach(pv => {
        const host = groups.find(g => !g.rest && !g.fsRelay && !g.legOnly &&
            ((g.speaker === pv.speaker && g.listener === pv.listener) ||
             g.label === pv.label));
        if (host && !host.verdict) {
            host.verdict = pv.verdict;
            host.verdictText = pv.verdictText;
            host.ah = pv.ah;
            host.dc = pv.dc;
        }
    });
    return groups;
}

// 方向组头用短角色名（主叫/被叫/FS）：分机号等身份编码只在流卡片上展示，
// 方向链路只关心"谁到谁"的角色，带编码反而看不出链路形状
const _shortParty = lb => {
    const m = /^(主叫|被叫|FS)/.exec(lb || '');
    return m ? m[1] : lb;
};

// 按每条流的真实收发双方（flow，后端从端口对 + SIP 身份标出）拼链路方向：
// 端→FS 是上行腿、FS→对端是下行腿，同一路媒体经 FS 转发时上下行 SSRC 不同，
// 只有收发双方能把两条腿接到同一条链路上（如"主叫 → 被叫"）。serverIp 是
// 拓扑里给出的 FS IP；媒体不经过 FS（点对点）或拓扑不止两端时，每条真实
// 链路腿单独成组（如"主叫 → FS"）；有流缺 flow 标注时返回 null，由调用方
// 退回角色前缀归组。
function _flowDirGroups(candidates, flowOf, p2p, serverIp) {
    const items = candidates.map(lb => ({ lb, flow: flowOf(lb) }))
        .filter(it => it.flow && it.flow.from && it.flow.to &&
                      it.flow.from.ip && it.flow.to.ip);
    if (!items.length || items.length < candidates.length) return null;

    const nameOf = ip => {
        const it = items.find(x => x.flow.from.ip === ip) ||
                   items.find(x => x.flow.to.ip === ip);
        return it ? _shortParty(it.flow.from.ip === ip ? it.flow.from.label
                                                       : it.flow.to.label) : ip;
    };

    const items_ = items.map(it => ({ ...it, taken: false }));
    const take = pred => {
        const gl = [];
        items_.forEach(it => {
            if (!it.taken && pred(it)) { it.taken = true; gl.push(it.lb); }
        });
        return gl;
    };

    const groups = [];
    if (serverIp && items.some(it => it.flow.from.ip === serverIp || it.flow.to.ip === serverIp)) {
        const fs = serverIp;
        const endpoints = [...new Set(items_.flatMap(it =>
            [it.flow.from.ip, it.flow.to.ip]))].filter(ip => ip !== fs);
        if (endpoints.length === 2) {
            const [a, b] = endpoints;
            [[a, b], [b, a]].forEach(([spk, lst]) => {
                const gl = take(it => {
                    const f = it.flow.from.ip, t = it.flow.to.ip;
                    // 上行（发→FS）、下行（FS→收）、点对点直连都算这一路
                    return (f === spk && t === fs) ||
                           (f === fs && t === lst) ||
                           (f === spk && t === lst);
                });
                if (gl.length) groups.push({
                    label: `${nameOf(spk)} → ${nameOf(lst)}`,
                    speaker: nameOf(spk), listener: nameOf(lst), p2p, labels: gl });
            });
        } else if (endpoints.length === 1) {
            // 单侧抓包只见"本端 ↔ FS"半程（对端不在抓包里）：每条腿单独成卡，
            // 卡头就是实际观测到的收发双方（本端 → FS / FS → 本端），
            // 只抓到一条腿时就出一张卡——不能宣称看不到的那半程
            const e = endpoints[0];
            items_.forEach(it => {
                if (it.taken) return;
                const fromFs = it.flow.from.ip === fs;
                const spk = fromFs ? 'FS' : (nameOf(e) || '主叫');
                const lst = fromFs ? (nameOf(e) || '主叫') : 'FS';
                const gl = take(x => x.flow.from.ip === it.flow.from.ip &&
                                     x.flow.to.ip === it.flow.to.ip);
                if (gl.length) groups.push({ label: `${spk} → ${lst}`,
                    speaker: spk, listener: lst, p2p: true, legOnly: true, labels: gl });
            });
        }
    }
    // 识别不出两端拓扑（多点会议 / 单侧抓包只见半程）：每条腿单独成组
    items_.filter(it => !it.taken).forEach(it => {
        const gl = take(x => x.flow.from.ip === it.flow.from.ip &&
                             x.flow.to.ip === it.flow.to.ip);
        groups.push({ label: `${_shortParty(it.flow.from.label)} → ${_shortParty(it.flow.to.label)}`,
            speaker: _shortParty(it.flow.from.label),
            listener: _shortParty(it.flow.to.label), p2p, labels: gl });
    });
    return groups.length ? groups : null;
}

// 严重（critical/P0）问题：用于流卡片顶部标红提示"这条流有问题"，
// 问题详情本身一律默认收起，用户点开再逐条看
const _isSevere = p => p.severity === 'critical' || p.priority === 'P0';

// 一条流的问题列表：顶部只留质量结论徽章，具体的问题分析（分类/证据/
// 排查方向）内容较长，全部收进折叠区，点击展开后按优先级排序展示
function _problemList(problems, feelNoun) {
    if (!problems || !problems.length) return '';
    const ordered = [...problems].sort((a, b) =>
        String(a.priority || 'P9').localeCompare(String(b.priority || 'P9')));
    const severeN = ordered.filter(_isSevere).length;
    const label = `共 ${ordered.length} 条问题分析` +
        (severeN ? `（其中 ${severeN} 条严重）` : '') +
        '（点开展开查看）';
    return `<details class="mt-1">` +
            `<summary class="small text-muted user-select-none">${label}</summary>` +
            `<div class="mt-2">${ordered.map(p => _problemCard(p, feelNoun)).join('')}</div></details>`;
}

const STREAM_ROLE_BADGE = {
    terminal: ['bg-primary', '主叫端'],
    seat: ['bg-success', '被叫端'],
    fs: ['bg-dark', '服务端（FS）'],
};

// 流卡片：角色 + SSRC + 质量结论徽章 + 关键指标 chips + 挂在本流下的问题
function _streamCard(label, q, kind, problems, feelNoun) {
    const { role, ssrc } = _parseStreamLabel(label);
    const rb = STREAM_ROLE_BADGE[role] || ['bg-secondary', '流'];
    const badge = QUALITY_BADGES[q.verdict] ||
        ['secondary', q.verdict === 'unknown' ? '无法判定' : (q.verdict || '—')];
    const chips = kind === 'video' ? _videoQualityChips(q) : _audioQualityChips(q);
    const bad = (problems || []).some(_isSevere);
    let html = `<div class="col-md-6"><div class="stream-card border rounded p-2 h-100${bad ? ' stream-card-bad' : ''}">`;
    html += '<div class="d-flex flex-wrap align-items-center gap-1">' +
        `<span class="badge ${rb[0]}">${rb[1]}</span>` +
        `<span class="stream-ssrc small">${_esc(ssrc || label)}</span>` +
        `<span class="badge bg-${badge[0]}">${_esc(badge[1])}</span>` +
        (q.codec ? `<span class="badge bg-light text-dark border">${_esc(q.codec)}</span>` : '') +
        '</div>';
    html += '<div class="mt-1">' + chips.map(c =>
        `<span class="badge bg-light text-dark border me-1 mb-1 fw-normal">${_esc(c)}</span>`
    ).join('') + '</div>';
    html += _problemList(problems, feelNoun);
    html += '</div></div>';
    return html;
}

// 问题归属：先按流（p.streams / 旧数据证据前缀）挂到流卡片，挂不上流
// 再按方向（p.directions / 证据包含方向标签）挂到链路头；两头都不中的
// 是全局问题，返回值挂在区块尾部。归属结果直接写进 groups（streamProblems
// 按 label 索引，problems 挂组头）。
function _attributeProblems(pc, groups) {
    const globalProblems = [];
    (pc.problems || []).forEach(p => {
        let hit = false;
        groups.forEach(g => {
            const ownStreams = lb =>
                (p.streams || []).includes(lb) ||
                (p.streams == null && (p.evidence || []).some(e => e.startsWith(lb)));
            const streamHits = g.labels.filter(ownStreams);
            if (streamHits.length) {
                hit = true;
                streamHits.forEach(lb => {
                    // 证据按流过滤：同一问题挂到多条流时，每张卡片只列自己
                    // 这条流的证据，避免 A 流卡片下出现 B 流的丢包数字误导
                    const ev = (p.evidence || []).filter(e => e.startsWith(lb));
                    const card = ev.length ? { ...p, evidence: ev } : p;
                    (g.streamProblems = g.streamProblems || {})[lb] =
                        (g.streamProblems[lb] || []).concat(card);
                });
                return;
            }
            if (!g.rest && !g.fsRelay && g.label) {
                const dirHit = (p.directions || []).some(d =>
                    d === g.label || d.includes(g.label) || g.label.includes(d)) ||
                    (p.directions == null &&
                     (p.evidence || []).some(e => e.includes(g.label)));
                if (dirHit) {
                    hit = true;
                    (g.problems = g.problems || []).push(p);
                }
            }
        });
        if (!hit) globalProblems.push(p);
    });
    return globalProblems;
}

// 方向组头：链路徽章 + 方向判定 + 挂组头的方向级问题
function _dirGroupHead(g, mq, kind, feelNoun) {
    let html = '<div class="d-flex flex-wrap align-items-center gap-2">';
    if (g.rest) {
        html += '<strong class="small">其他流</strong>' +
            '<span class="text-muted small">（未能归入链路方向）</span>';
    } else if (g.fsRelay) {
        html += _chainHtml(g.speaker || '主叫', g.listener || '被叫', false) +
            '<span class="text-muted small">（服务端转发流，方向无法判定）</span>';
    } else {
        html += _chainHtml(g.speaker, g.listener, g.p2p);
        if (g.verdict) html += _healthBadge(g.verdict);
        if (g.verdictText) {
            html += `<span class="small text-muted">${_esc(g.verdictText)}</span>`;
        }
    }
    html += '</div>' + _problemList(g.problems, feelNoun);
    return html;
}

// 区块尾部：全局问题 + 无法仅凭抓包确认的问题清单（折叠表）
function _mediaSectionFooter(pc, globalProblems, feelNoun) {
    let html = '';
    if (globalProblems.length) {
        html += '<div class="mt-2"><div class="small text-muted mb-1">全局问题（无法归属到单条流或方向）：</div>' +
            _problemList(globalProblems, feelNoun) + '</div>';
    }
    if (pc.unobservable && pc.unobservable.length) {
        html += `<details class="mt-2"><summary class="small text-muted user-select-none">另有 ${pc.unobservable.length} 类${_esc(feelNoun)}问题无法仅凭抓包确认（点开看原因与人工验证方法）</summary>`;
        html += '<div class="table-responsive mt-1"><table class="table table-sm table-bordered small mb-0">' +
                '<thead><tr><th>类别</th><th>问题</th><th>用户' + _esc(feelNoun) + '</th><th>为什么抓包看不到</th><th>人工验证方法</th></tr></thead><tbody>';
        pc.unobservable.forEach(u => {
            html += `<tr><td>${_esc(u.category)}</td><td>${_esc(u.name)}</td>` +
                    `<td>${u.feel.map(f => `“${_esc(f)}”`).join(' ')}</td>` +
                    `<td>${_esc(u.why)}</td><td>${_esc(u.verify)}</td></tr>`;
        });
        html += '</tbody></table></div></details>';
    }
    return html;
}

// 音/视频区块入口（回放区没有任何媒体条目时的兜底，避免问题没地方展示）
function renderMediaSections(report) {
    return _renderMediaSection(report, 'audio') + _renderMediaSection(report, 'video');
}

function _renderMediaSection(report, kind) {
    const pc = kind === 'audio' ? report.problem_classification
                                : report.video_problem_classification;
    if (!pc || !pc.available) return '';
    const meta = kind === 'audio'
        ? { title: '音频', icon: 'bi-music-note-beamed', docName: '声音问题种类',
            feelNoun: '听感', empty: '抓包层面未发现可归类的声音问题。' }
        : { title: '视频', icon: 'bi-camera-video', docName: '视频问题',
            feelNoun: '观感', empty: '抓包层面未发现可归类的视频问题。' };
    const mq = (report.media_quality || {})[kind] || {};
    const p2p = _mediaP2p(report);
    const groups = _buildDirGroups(Object.keys(mq), report, kind, p2p);
    // 与回放区同构：每个链路方向一张卡，按"主叫 → 被叫"在前排序，
    // 全部包进同一个整体容器；归不了链路的组放最后
    const chain = groups.filter(g => g.label && !g.rest && !g.fsRelay)
        .sort((a, b) => ((b.speaker || '').startsWith('主叫') ? 1 : 0) -
                        ((a.speaker || '').startsWith('主叫') ? 1 : 0));
    const others = groups.filter(g => !(g.label && !g.rest && !g.fsRelay));
    const renderGroups = [...chain, ...others];
    const globalProblems = _attributeProblems(pc, renderGroups);

    let html = `<h6 class="mt-3"><i class="bi ${meta.icon} text-primary"></i> ${meta.title}` +
        ` <span class="text-muted small fw-normal">对照《${_esc(meta.docName)}》清单，问题挂在对应的流下面</span></h6>`;
    if (pc.summary) {
        html += `<div class="alert alert-secondary py-2 small mb-2">${_esc(pc.summary)}</div>`;
    }
    (pc.notes || []).forEach(n => {
        html += `<p class="small text-muted mb-2">${_esc(n)}</p>`;
    });
    if (!renderGroups.length) {
        html += `<div class="alert alert-success py-2 mb-2">${_esc(meta.empty)}</div>`;
    }
    html += '<div class="border rounded p-2 mb-3 bg-body-tertiary">';
    renderGroups.forEach(g => {
        html += '<div class="bg-body border rounded p-2 mb-2">';
        html += _dirGroupHead(g, mq, kind, meta.feelNoun);
        if (g.labels.length) {
            html += '<div class="row g-2 mt-1">' + g.labels.map(lb =>
                _streamCard(lb, mq[lb] || {}, kind, (g.streamProblems || {})[lb], meta.feelNoun)
            ).join('') + '</div>';
        }
        html += '</div>';
    });
    html += '</div>';
    html += _mediaSectionFooter(pc, globalProblems, meta.feelNoun);
    return html;
}

// ====== 问题卡片（供上方音/视频区块的流卡片、链路头复用） ======
// 每张卡片：优先级/严重度徽章 + 种类描述 + 用户听感词 + 证据 + 排查方向 +
// 验证方法
const PRIO_BADGE = {P0: 'danger', P1: 'warning', P2: 'info', P3: 'secondary'};

function _problemCard(p, feelNoun) {
    feelNoun = feelNoun || '听感';
    let html = '<div class="border rounded p-2 mb-2">';
    html += '<div class="d-flex flex-wrap align-items-center gap-2">' +
            `<span class="badge bg-${PRIO_BADGE[p.priority] || 'secondary'}">${p.priority}</span>` +
            `<strong>${_esc(p.name)}</strong>` +
            `<span class="badge bg-light text-dark border">${_esc(p.category)}</span>` +
            `<code class="small">${_esc(p.term)}</code>` +
            `<span class="badge bg-${p.severity === 'critical' ? 'danger' : p.severity === 'warning' ? 'warning' : 'secondary'}">` +
            `${p.severity === 'critical' ? '严重' : p.severity === 'warning' ? '注意' : '提示'}</span>` +
            '</div>';
    html += `<div class="small mt-1">用户${feelNoun}：` +
            p.feel.map(f => `<span class="badge bg-warning-subtle text-dark border border-warning-subtle me-1 fw-normal">“${_esc(f)}”</span>`).join('') +
            '</div>';
    html += `<div class="small text-muted mt-1">${_esc(p.description)}</div>`;
    if (p.evidence && p.evidence.length) {
        html += '<div class="small mt-1"><strong>证据：</strong><ul class="mb-0 ps-4">';
        p.evidence.forEach(e => { html += `<li>${_esc(e)}</li>`; });
        html += '</ul></div>';
    }
    html += `<div class="small mt-1"><strong>排查方向：</strong>${_esc((p.causes || []).join('；'))}</div>`;
    html += `<div class="small"><strong>验证方法：</strong>${_esc((p.verify || []).join('；'))}</div>`;
    html += '</div>';
    return html;
}

function renderRtcp(rtcp) {
    const labels = Object.keys(rtcp || {});
    let html = '<h6 class="mt-3">RTCP 收发报告</h6>';
    if (!labels.length) {
        return html + '<p class="text-muted small mb-3">未捕获 RTCP 报告——接收端视角的丢包/抖动不可观测。</p>';
    }
    html += `<p class="small text-muted mb-2">SR 由发送端报告已产出的媒体量（证明确实在发声）；` +
        `RR 由接收端报告收流质量（丢包/抖动），是"听者视角"的亲历佐证；` +
        `PLI/FIR 是接收端在等关键帧、NACK 在指名重传——视频花屏排查的直接佐证。</p>`;
    html += '<div class="table-responsive"><table class="table table-sm table-bordered mb-0">' +
        '<thead><tr><th>流</th><th>SR 已发包数/字节数</th><th>RR 丢包率</th><th>累计丢包</th>' +
        '<th>RR 抖动(ts)</th><th>关键帧请求/重传</th><th>RR 上报方</th></tr></thead><tbody>';
    labels.forEach(label => {
        const e = rtcp[label] || {};
        // sr/rr 恒为对象（可能为空 {}，JS 里为 truthy），按键数判断有无数据
        const sr = e.sr, rr = e.rr;
        const hasSr = !!(sr && Object.keys(sr).length);
        const hasRr = !!(rr && Object.keys(rr).length);
        const hex = x => '0x' + Number(x).toString(16).padStart(8, '0');
        // 反馈统计：PLI/FIR 次数 + NACK 重传包数（无则显示 —）
        const fb = e.fb || {};
        const fbParts = [];
        if (fb.pli?.count) fbParts.push(`PLI ${fb.pli.count}`);
        if (fb.fir?.count) fbParts.push(`FIR ${fb.fir.count}`);
        if (fb.nack?.requested) fbParts.push(`NACK 重传 ${fb.nack.requested} 包`);
        const fbTxt = fbParts.length ? fbParts.join(' · ') : '—';
        html += `<tr><td class="text-nowrap">${_esc(label)}` +
            (e.kind === 'video' ? ' <span class="badge bg-danger">视频</span>' : '') + `</td>` +
            `<td>${hasSr ? `${sr.pkt_count ?? '—'} / ${sr.octet_count ?? '—'}` : '—'}</td>` +
            `<td>${hasRr ? `${rr.fraction_lost_pct ?? '—'}%` : '—'}</td>` +
            `<td>${hasRr ? (rr.cum_lost ?? '—') : '—'}</td>` +
            `<td>${hasRr ? (rr.jitter ?? '—') : '—'}</td>` +
            `<td>${_esc(fbTxt)}</td>` +
            `<td class="text-nowrap">${hasRr && rr.reporters ? rr.reporters.map(hex).join(', ') : '—'}</td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
}

// ====== 音视频回放展示 ======
const ROLE_NAMES = { seat: '被叫端（坐席）', fs: '服务端（FS）', terminal: '主叫端（终端）' };
// 回放卡片的抓包来源名：三份抓包都传时同一条流会在每份抓包里各重建一段，
// 卡片必须标明音/视频取自哪份抓包，听感对比时才能对号入座
const CAPTURE_SOURCE_NAMES = { terminal: '主叫侧抓包', fs: '服务端抓包', seat: '被叫侧抓包' };
const DIR_NAMES = { inbound: '呼入（接收）', outbound: '呼出（发送）', unknown: '方向未知' };
const DIR_BADGE = { inbound: 'bg-info', outbound: 'bg-success', unknown: 'bg-secondary' };

// ====== 通话与 SIP 信令展示 ======
let detectedServerIp = null;
let ipRoleMap = {};

const CALL_STATUS = {
    complete:       { label: '完整',       badge: 'bg-success',        icon: 'bi-check-circle-fill' },
    truncated_head: { label: '缺开头',     badge: 'bg-warning text-dark', icon: 'bi-skip-start-fill' },
    truncated_tail: { label: '缺结尾',     badge: 'bg-warning text-dark', icon: 'bi-skip-end-fill' },
    truncated_both: { label: '首尾不完整', badge: 'bg-danger',         icon: 'bi-exclamation-triangle-fill' },
};
const SIP_KIND_CLASS = { request: 'sip-req', provisional: 'sip-prov', success: 'sip-ok', error: 'sip-err' };

function callLabel(callId) {
    return (callId || '').replace('call_', '通话 ');
}

// From/To 显示名/分机号是抓包里的自由文本，插入 innerHTML 前需转义
// 展示术语：服务端不绑定具体实现（FS/FreeSWITCH 只是其中一种），
// 界面统一说"服务端"；后端返回的腿名/段名/说明里出现 FS 也在这里转掉
const _svcTerm = s => String(s).replace(/(?<![A-Za-z0-9])FS(?![A-Za-z0-9])/g, '服务端');

function _esc(s) {
    return _svcTerm(s).replace(/[&<>"']/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 每列设备 IP 的 SIP 身份（分机号/显示名）：
// - 主叫：主叫自己发出的第一个请求的 From（UAC 自报身份）。
// - 被叫：呼向被叫的 INVITE 的 To（被叫分机号）。不能用被叫响应里的 From——
//   RFC 3261 要求响应回显请求的 From，那只是主叫身份的副本。
function _sipIdents(msgs, caller, answerer) {
    const idents = {};
    const usable = h => h && (h.user || h.name);
    if (caller) {
        const m = msgs.find(m => m.src === caller && usable(m.from));
        if (m) idents[caller] = m.from;
    }
    if (answerer) {
        const m = msgs.find(m => m.dst === answerer && m.method === 'INVITE' && usable(m.to)) ||
                  msgs.find(m => m.dst === answerer && usable(m.to));
        if (m) idents[answerer] = m.to;
    }
    return idents;
}

// SIP 身份按抓包原文展示，不做 base64 解码——平台分机号本身可能就是这种
// 串（"LTE2Nzcx..."），解码反而得到错误内容
function _identLabel(id) {
    if (!id) return '';
    if (id.name && id.user && id.name !== id.user && !id.name.includes(id.user))
        return `${id.name}（${id.user}）`;
    return id.name || id.user || '';
}

// 时序阶梯图：只保留「谁打给谁」—— 经服务器为左(主叫)/中(FS)/右(被叫)三列，
// 点对点为左右两列；并发振铃的分叉目标等其他参与方及其消息不展示。
function _sipParties(flow) {
    const ips = [flow[0].src];
    flow.forEach(m => {
        if (!ips.includes(m.src)) ips.push(m.src);
        if (!ips.includes(m.dst)) ips.push(m.dst);
    });
    const server = detectedServerIp && ips.includes(detectedServerIp) ? detectedServerIp : null;
    // 主叫：第一个非服务器侧发出的 INVITE；被叫：INVITE 事务 200 OK 的非服务器发送方
    // （用 CSeq 方法判断归属，排除 CANCEL/BYE 的 200 Ok 干扰）
    const inv = flow.find(m => m.method === 'INVITE' && m.src !== server) ||
                flow.find(m => m.kind === 'request') || flow[0];
    const caller = inv.src;
    const ok = flow.find(m => m.method === '200' && m.cseq_method === 'INVITE' && m.src !== server);
    let answerer = ok ? ok.src : null;
    // 未接通的通话（CANCEL/486/480/487 收场）没有 INVITE 的 200 OK：被叫退而
    // 取信令里出现最多的非服务器对端，保证被叫腿不会从阶梯图整列消失
    if (!answerer) {
        const peers = {};
        flow.forEach(m => [m.src, m.dst].forEach(ip => {
            if (ip && ip !== server && ip !== caller) peers[ip] = (peers[ip] || 0) + 1;
        }));
        const ranked = Object.entries(peers).sort((a, b) => b[1] - a[1]);
        answerer = ranked.length ? ranked[0][0]
            : (inv.dst !== server && inv.dst !== caller ? inv.dst : null);
    }

    const cols = [caller];
    if (server && server !== caller) cols.push(server);
    if (answerer && !cols.includes(answerer)) cols.push(answerer);
    let msgs = flow.filter(m => cols.includes(m.src) && cols.includes(m.dst));
    if (!msgs.length) msgs = flow;   // 兜底：判定失败时不过滤
    return { cols, server, caller, answerer, msgs };
}

// SDP 消息的线上小标记：INVITE 行标「支持」（主叫/re-INVITE 报的支持列表），
// 带 SDP 的 1xx（如 183 早释）标「早期应答」（先建早媒体的那次应答），200 OK
// 标「最终应答」（正式接通的应答）——一条腿两次应答是正常流程，标签区分开
// 免得误读为重复；ACK 等 SDP 仍标「应答」（慢启动时 200 OK 带 offer、ACK 里
// 才是 answer）。完整编码列表由 _sdpListRow 在该消息行下方独立成行展示，
// 不受信令线跨度裁剪；FS 自产 INVITE 的 SDP 用静态 PT 无 rtpmap、解析不出
// 编码名，标记与列表都不显示
function _sdpTag(m) {
    if (m.method === 'INVITE') return '支持';
    if (m.kind === 'provisional') return '早期应答';
    if (m.kind === 'success') return '最终应答';
    return '应答';
}

function _sdpTags(m) {
    const sc = m.sdp_codecs;
    if (!sc || !(sc.audio?.length || sc.video?.length)) return '';
    return `<span class="sl-sdp" title="下方独立行列出该消息 SDP 的完整编码列表">` +
        `<i class="bi bi-file-earmark-code"></i> ${_sdpTag(m)}</span>`;
}

// SDP 完整编码列表行：挂在消息行下方独立成行，可完整换行
function _sdpListRow(m) {
    const sc = m.sdp_codecs;
    if (!sc || !(sc.audio?.length || sc.video?.length)) return '';
    const parts = [];
    if (sc.audio?.length) parts.push(`音频 ${sc.audio.join(' / ')}`);
    if (sc.video?.length) parts.push(`视频 ${sc.video.join(' / ')}`);
    return `<div class="sl-sdplist"><span class="sl-sdp">` +
        `<i class="bi bi-file-earmark-code"></i> ${_sdpTag(m)}</span> ${parts.join('，')}</div>`;
}

function _sipLadder(flow, call) {
    if (!flow || !flow.length) return '';
    const { cols, server, caller, answerer, msgs } = _sipParties(flow);
    const idents = _sipIdents(msgs, caller, answerer);
    const n = cols.length;
    const colOf = ip => Math.max(0, cols.indexOf(ip));
    const pct = v => (v * 100).toFixed(3) + '%';

    let html = `<div class="sl-head"><span class="sl-gutter"></span>` +
        `<div class="sl-track" style="grid-template-columns:repeat(${n},1fr)">`;
    cols.forEach(ip => {
        let name, ipSub = '';
        if (ip === server) {
            name = '服务端（FS）';
            ipSub = ip;
        } else {
            const label = _esc(_identLabel(idents[ip]));
            name = label || _ipName(ip);
            if (name !== ip) ipSub = ip;   // 有身份名时，IP 缩进副行保留
        }
        // FS 自己发 INVITE 的外呼腿：From 头是 FS 转报的原始主叫身份，
        // 主叫端点不在抓包里，挂注在 FS 列展示
        let relay = '';
        if (ip === server && caller === server && idents[ip]) {
            const lbl = _identLabel(idents[ip]);
            if (lbl) relay = lbl;
        }
        const badge = ip === caller ? '<span class="sl-role bg-primary text-white">主叫</span>'
            : ip === answerer ? '<span class="sl-role bg-success text-white">被叫</span>' : '';
        html += `<div class="sl-p"><div class="sl-name"${ipSub ? ` title="${name}"` : ''}>${name}</div>` +
            (ipSub ? `<div class="sl-ip">${ipSub}</div>` : '') +
            (relay ? `<div class="sl-ip" title="${_esc(relay)}">主叫(转报): ${_esc(relay)}</div>` : '') +
            badge + `</div>`;
    });
    html += `</div></div><div class="sl-body"><div class="sl-lines">`;
    cols.forEach((ip, i) => {
        html += `<i class="sl-line" style="left:${pct((i + 0.5) / n)}"></i>`;
    });
    html += `</div>`;
    // RTP 部分：编码标签 + 媒体开始/结束标线，按媒体时间插入消息时间线——
    // 两条标线成对落在首条 BYE 行之前（开始线在上、结束线在下）。time_str
    // 是定宽 HH:MM:SS，可直接比较。
    // 带 SDP 编码的消息在行下追加一条独立列表行；rowBefore/rowAfter 记录
    // 每条消息的行区间，供标线/协商行按消息下标锚定。
    const rows = [];
    const rowBefore = {}, rowAfter = {};
    msgs.forEach((m, i) => {
        const a = colOf(m.src), b = colOf(m.dst);
        const kindCls = SIP_KIND_CLASS[m.kind] || '';
        let inner;
        if (a === b) {
            inner = `<div class="sl-msg ${kindCls} sl-self" style="left:${pct((a + 0.5) / n)}">` +
                `<span class="lb">${m.label}${_sdpTags(m)}</span></div>`;
        } else {
            const lo = Math.min(a, b), hi = Math.max(a, b);
            const lSeg = a < b ? '<i class="ln"></i>' : '<i class="ln arr-l"></i>';
            const rSeg = a < b ? '<i class="ln arr-r"></i>' : '<i class="ln"></i>';
            inner = `<div class="sl-msg ${kindCls}" ` +
                `style="left:${pct((lo + 0.5) / n)};width:${pct((hi - lo) / n)}">` +
                `${lSeg}<span class="lb">${m.label}${_sdpTags(m)}</span>${rSeg}</div>`;
        }
        rowBefore[i] = rows.length;
        rows.push(`<div class="sl-row"><span class="sl-t">${m.time_str}</span>` +
            `<div class="sl-track" style="grid-template-columns:repeat(${n},1fr)">${inner}</div></div>`);
        const list = _sdpListRow(m);
        if (list) rows.push(list);
        rowAfter[i] = rows.length;
    });
    if (call) {
        // 标线成对放在首条 BYE 行之前：开始线在上、结束线在下，媒体区间作为
        // 挂断前的整体标注展示。RTP 首末包时间（talk_*，无信令时后端回退为
        // 整段媒体）只用于标签显示。不按应答 200 OK 给开始线单独锚位——缺头
        // 通话抓到的应答是中途 re-INVITE，开始线会被锚到图中间 100 之前
        const sStr = call.talk_start_str || call.start_str;
        const eStr = call.talk_end_str || call.end_str;
        const dur = call.talk_duration_s ?? call.duration_s;
        const codecs = call.codecs || {};
        const chips = [];
        if (codecs.audio?.length)
            chips.push(`<span class="badge text-bg-light border"><i class="bi bi-music-note-beamed"></i> 音频 ${codecs.audio.join(' / ')}</span>`);
        if (codecs.video?.length)
            chips.push(`<span class="badge text-bg-light border"><i class="bi bi-camera-video"></i> 视频 ${codecs.video.join(' / ')}</span>`);
        // 结束位置：首条 BYE 行之前；无 BYE 再按媒体结束时间插
        let ek = msgs.findIndex(m => m.method === 'BYE');
        if (ek === -1)
            ek = eStr ? msgs.findIndex(m => m.time_str >= eStr) : -1;
        // 两条标线同一行位（ei），先插结束线再插开始线 → 开始线在上
        let ei = ek === -1 ? rows.length : rowBefore[ek];
        let si = ei;
        if (eStr)
            rows.splice(ei, 0, `<div class="sl-marker sl-end"><span class="lb">` +
                `<i class="bi bi-stop-fill"></i> RTP 媒体结束 ${eStr}（持续 ${dur}s）</span></div>`);
        if (sStr)
            rows.splice(si, 0, `<div class="sl-marker sl-start"><span class="lb">` +
                `<i class="bi bi-play-fill"></i> RTP 媒体开始 ${sStr}</span></div>`);
        if (chips.length)
            rows.splice(si + 1, 0, `<div class="sl-codecs">${chips.join('')}</div>`);
        // 两腿协商编码（后端按 Call-ID 配对好）：主叫侧、被叫侧各一行，先
        // 摆出每条腿各定了什么编码，再接下面的 FS 转码判定行——判定本身就是
        // 对比这两行，展示顺序与判定依据一致。旧会话数据没有 per-leg 字段时
        // 回退为单行主叫腿汇总。
        // 只认带编码名的 SDP 行：FS 自产 INVITE 的 SDP（无 rtpmap）在
        // 后端配对时已被跳过，这里保持一致，协商行锚在其正主应答行
        // （含列表子行）之后
        // 只认带编码名的 SDP 行：FS 自产 INVITE 的 SDP（无 rtpmap）在
        // 后端配对时已被跳过，这里保持一致。同时按腿（call_id）记住每条腿
        // 最后一条 SDP 行的行号——该腿的协商行锚在这行（= 该腿应答行）之后，
        // 即协商完成的时刻，不早于该腿的应答出现在图上
        const sdpRows = [];
        const legAnchors = {};
        msgs.forEach((m, i) => {
            if (m.sdp_codecs &&
                (m.sdp_codecs.audio?.length || m.sdp_codecs.video?.length)) {
                sdpRows.push(rowAfter[i]);
                if (m.call_id) legAnchors[m.call_id] = rowAfter[i];
            }
        });
        // 旧会话数据（协商行无 call_id）的兜底锚点：第二条 SDP 行之后
        let ni = sdpRows.length >= 2 ? sdpRows[1]
               : sdpRows.length === 1 ? sdpRows[0] : si;
        ni = Math.min(ni, si);
        const fmtLegChips = leg => {
            const chips = [];
            if (leg.audio?.length)
                chips.push(`<span class="badge text-bg-light border"><i class="bi bi-music-note-beamed"></i> 音频 ${leg.audio.join(' / ')}</span>`);
            if (leg.video?.length)
                chips.push(`<span class="badge text-bg-light border"><i class="bi bi-camera-video"></i> 视频 ${leg.video.join(' / ')}</span>`);
            return chips;
        };
        // 待插入行列表 {anchor, prio, html}：统一按锚点从大到小 splice（大
        // 锚点先插不会影响更小的锚点位置）。同锚点时 prio 大的先插、最终排
        // 在后面——判定行因此排在同位置的协商行之后
        const inserts = [];
        const npl = call.negotiated_per_leg || {};
        [['caller', '主叫', 'bi-telephone-outbound'],
         ['callee', '被叫', 'bi-telephone-inbound']].forEach(([key, name, icon]) => {
            const leg = npl[key];
            if (!leg) return;
            const chips = fmtLegChips(leg);
            if (!chips.length) return;
            const label = leg.answered === false
                ? `${name}候选编码（未收到应答）` : `${name}侧协商`;
            const anchor = (leg.call_id && legAnchors[leg.call_id] != null)
                ? Math.min(legAnchors[leg.call_id], si) : ni;
            inserts.push({anchor, prio: 0, html:
                `<span class="text-muted small me-1"><i class="bi ${icon}"></i> ${label}</span>${chips.join('')}`});
        });
        if (!inserts.length) {
            const chips = fmtLegChips(call.negotiated_codecs || {});
            if (chips.length) {
                const negLabel = call.sdp_answered === false
                    ? '主叫候选编码（未收到应答）' : '协商编码';
                inserts.push({anchor: ni, prio: 0, html:
                    `<span class="text-muted small me-1"><i class="bi bi-handshake"></i> ${negLabel}</span>${chips.join('')}`});
            }
        }
        // FS 是否参与编解码（后端对比两腿协商编码 + 媒体路径判定）：固定在
        // RTP 媒体开始标线之前——两腿协商全部结束、呼叫接通之后才有结论，
        // 转码结论着色强调；unknown 也如实展示（灰字）
        const fm = call.fs_media;
        if (fm && fm.verdict) {
            const meta = {
                transcode: {cls: 'bg-danger', label: '服务端参与转码（FS）'},
                same: {cls: 'bg-success', label: '服务端未转码'},
                bypass: {cls: 'bg-info text-dark', label: '媒体不经服务端'},
                unknown: {cls: 'bg-light text-dark', label: '无法判定'},
            }[fm.verdict] || {cls: 'bg-light text-dark', label: '服务端媒体处理'};
            inserts.push({anchor: si, prio: 1, html:
                `<span class="badge ${meta.cls} me-1"><i class="bi bi-cpu"></i> ${meta.label}</span>` +
                `<span class="small${fm.verdict === 'unknown' ? ' text-muted' : ''}">${_esc(fm.text || '')}</span>`});
        }
        inserts.sort((a, b) => (b.anchor - a.anchor) || ((b.prio || 0) - (a.prio || 0)));
        for (const it of inserts)
            rows.splice(it.anchor, 0, `<div class="sl-codecs">${it.html}</div>`);
    }
    return html + rows.join('') + `</div>`;
}

// 卡片头部的「谁打给谁」摘要：主叫 → （FS）→ 被叫，身份与阶梯图列头一致
function _callPartyChain(flow) {
    if (!flow || !flow.length) return '';
    const { server, caller, answerer, msgs } = _sipParties(flow);
    const idents = _sipIdents(msgs, caller, answerer);
    const seg = (badge, badgeCls, ip, id) => {
        const name = _esc(_identLabel(id) || _ipName(ip));
        return `<span class="badge ${badgeCls}">${badge}</span>` +
            `<span class="text-truncate d-inline-block align-bottom" style="max-width:380px" title="${name}">${name}</span>` +
            `<span class="text-muted">${ip}</span>`;
    };
    const arrow = '<i class="bi bi-arrow-right text-muted"></i>';
    let html = seg('主叫', 'bg-primary', caller, idents[caller]);
    if (server) html += arrow + '<span class="badge bg-dark">服务端</span>';
    if (answerer) html += arrow + seg('被叫', 'bg-success', answerer, idents[answerer]);
    return `<span class="d-inline-flex align-items-center gap-1 flex-wrap small">${html}</span>`;
}

function buildIpRoleMap(files, serverIp) {
    detectedServerIp = serverIp;
    ipRoleMap = {};
    const sorted = files.slice().sort((a, b) =>
        (a.role === 'fs' || a.role === 'FS' ? 1 : 0) - (b.role === 'fs' || b.role === 'FS' ? 1 : 0));
    sorted.forEach(f => {
        const isFs = f.role === 'fs' || f.role === 'FS';
        (f.ips || []).forEach(ip => {
            if (ip === serverIp) return;
            if (isFs && ip in ipRoleMap) return;
            ipRoleMap[ip] = isFs ? null : (ROLE_NAMES[f.role] || f.role);
        });
    });
}

function _ipName(ip) {
    return ipRoleMap[ip] || ip;
}

// 抓包完整性提醒（截短包/文件尾损坏）：与首页同款——只提示数据受限，
// 分析照常。files 为 /api/session 返回的上传文件列表（元素带 integrity）
function _integrityWarningHtml(files) {
    const rows = (files || []).filter(f => f.integrity && f.integrity.status === 'warn')
        .map(f => `<li><strong>${ROLE_NAMES[f.role] || f.role}</strong>（${_esc(f.filename)}）：` +
            `<ul class="list-unstyled mb-0 ms-3 text-muted">${(f.integrity.notes || [])
                .map(n => `<li>${_esc(n)}</li>`).join('')}</ul></li>`);
    if (!rows.length) return '';
    return `
        <div class="alert alert-warning mb-2 py-2 small">
            <strong><i class="bi bi-crop me-1"></i>抓包可能不完整（已按现有数据继续分析）</strong>
            <ul class="mb-1 mt-2 ps-3">${rows.join('')}</ul>
            <div class="text-muted">截短的包缺失部分载荷，可能影响媒体重建与统计精度；建议确认抓包快照长度，必要时重新抓包或重新导出文件。</div>
        </div>`;
}

function _captureWarningHtml(w) {
    // 纵向列表：每份抓包一行（总体时间段 + 每通通话时间段），与首页一致
    const rows = (w.roles || []).map(r => {
        const ov = r.overall || {};
        const head = ov.count
            ? `${r.display}：${ov.start} ~ ${ov.end}（${ov.count} 通）`
            : `${r.display}：未检测到通话`;
        const subs = (r.calls || []).map(c =>
            `<li class="ms-4 text-muted">└ ${c.label}：${c.start} ~ ${c.end}</li>`).join('');
        return `<li>${head}${subs ? `<ul class="list-unstyled mb-0">${subs}</ul>` : ''}</li>`;
    }).join('');
    return `
        <div class="alert alert-warning mb-2 py-2 small">
            <strong><i class="bi bi-exclamation-triangle me-1"></i>抓包一致性提醒</strong>
            <div class="mt-1">${w.message}</div>
            <ul class="list-unstyled mb-0 mt-2">${rows}</ul>
        </div>`;
}

// ====== 多通通话切换 ======
// 抓包里检测到多通通话时在顶部提示：结果页只分析了其中一通（或混在一起），
// 可切换到其他通话重新分析（POST /api/analyze 后刷新页面）
let switchingCall = false;

function renderCallSwitcher(calls, currentCallId, results, uploads) {
    if (!calls || calls.length < 2) return;
    const banner = document.getElementById('call-switch-banner');
    const mediaType = results.media_type || 'audio';
    const direction = results.direction || 'auto';
    const curTxt = currentCallId
        ? `当前分析的是<strong>${callLabel(currentCallId)}</strong>，可切换到其他通话：`
        : '当前展示的是所有通话混在一起的结果，建议选择具体通话分析：';
    const btns = calls.map(c => {
        const st = CALL_STATUS[c.completeness.status] || CALL_STATUS.complete;
        const cur = c.call_id === currentCallId;
        const cls = cur ? 'btn-primary' : 'btn-outline-primary';
        const dis = cur || switchingCall ? 'disabled' : '';
        const title = `${c.start_str} ~ ${c.end_str} · ${c.stream_count} 条流`;
        // 单来源通话在切换按钮上也要醒目：这通电话其余抓包里没有
        const onlySrc = uploads && uploads.length > 1 && (c.files || []).length === 1
            ? `<span class="badge bg-danger ms-1" title="${(c.files || [])
                .map(f => ROLE_NAMES[f] || f).join('、')}的抓包里才有这通通话">仅一处抓包</span>`
            : '';
        const fmBadge = {
            transcode: '<span class="badge bg-danger ms-1"><i class="bi bi-shuffle"></i> 服务端转码（FS）</span>',
            same: '<span class="badge bg-success ms-1"><i class="bi bi-check2-circle"></i> 服务端未转码</span>',
        }[c.fs_media?.verdict] || '';
        return `<button type="button" class="btn btn-sm ${cls}" ${dis}
                    onclick="switchCall('${c.call_id}', '${mediaType}', '${direction}')"
                    title="${title}">
                    <i class="bi bi-telephone"></i> ${callLabel(c.call_id)}
                    <span class="badge ${st.badge} ms-1"><i class="bi ${st.icon}"></i> ${st.label}</span>${fmBadge}${onlySrc}
                    <span class="ms-1 small">${title}</span>
                </button>`;
    }).join('');
    banner.classList.remove('d-none');
    banner.innerHTML = `
        <div class="alert alert-info mb-0">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <strong><i class="bi bi-collection me-1"></i>检测到 ${calls.length} 通通话</strong>
                <span class="small">${curTxt}</span>
            </div>
            <div class="d-flex flex-wrap gap-2 mt-2">${btns}</div>
        </div>`;
}

function switchCall(callId, mediaType, direction) {
    if (switchingCall) return;
    switchingCall = true;
    fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            session_id: SESSION_ID,
            direction: direction,
            media_type: mediaType,
            call_id: callId,
        }),
    })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(() => location.reload())
        .catch(err => {
            switchingCall = false;
            alert('切换通话失败：' + err.message);
        });
}

// ====== 追加分析（媒体范围切换） ======
// 结果页只展示本次 /api/analyze 所选 media_type 范围的结果。会话里还有
// 本次没分析的媒体流时，顶部给出切换按钮：用同一份上传的抓包重新分析
// （保持通话/方向不变），无需回首页重新上传。
// 推荐项是"音频+视频一起分析"（media_type=all，两种结果同页都有），
// 另给一个"只看另一种媒体"的精简选项；当前已是全范围时无需展示。
let switchingMedia = false;
let currentMediaType = null;
let currentDirection = 'auto';
let currentCallId = null;

function renderMediaSwitcher(data, results) {
    const hasAudio = (data.audio_streams || 0) > 0;
    const hasVideo = (data.video_streams || 0) > 0;
    if (!hasAudio || !hasVideo) return;   // 会话里只有一种媒体，没什么可追加

    currentMediaType = (results && results.media_type) || 'audio';
    currentDirection = (results && results.direction) || 'auto';
    currentCallId = (results && results.call_id) || null;
    if (currentMediaType === 'all') return;   // 音频+视频都已分析

    const curTxt = currentMediaType === 'audio' ? '音频' : '视频';
    const other = currentMediaType === 'audio' ? 'video' : 'audio';
    const otherTxt = currentMediaType === 'audio' ? '视频' : '音频';
    const btn = (mt, label, icon, cls, title) =>
        `<button type="button" class="btn btn-sm ${cls}" ${switchingMedia ? 'disabled' : ''}
            onclick="switchMediaType('${mt}')" title="${title}">
            <i class="bi ${icon}"></i> ${label}
        </button>`;
    const banner = document.getElementById('media-switch-banner');
    banner.classList.remove('d-none');
    banner.innerHTML = `
        <div class="alert alert-info mb-0">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <strong><i class="bi bi-plus-circle me-1"></i>追加分析</strong>
                <span class="small">本次分析的是<strong>${curTxt}</strong>，检测到同一份抓包里还有${otherTxt}流，可直接补充分析（无需重新上传）：</span>
                ${btn('all', `音频 + ${otherTxt}一起分析`, 'bi-collection-play',
                      'btn-primary',
                      `重新分析音频和视频，两种结果在同一页展示`)}
                ${btn(other, `改为只分析${otherTxt}`, 'bi-arrow-repeat',
                      'btn-outline-primary',
                      `重新分析，只展示${otherTxt}的结果`)}
            </div>
            <div class="small text-muted mt-1${switchingMedia ? '' : ' d-none'}" id="media-switch-status"></div>
        </div>`;
}

function switchMediaType(mediaType) {
    if (switchingMedia || switchingCall) return;
    switchingMedia = true;
    // 禁掉两个横幅的所有按钮，避免分析进行中又触发切换
    document.querySelectorAll('#media-switch-banner button, #call-switch-banner button')
        .forEach(b => b.disabled = true);
    const status = document.getElementById('media-switch-status');
    if (status) {
        status.classList.remove('d-none');
        status.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>' +
            '正在分析中，媒体重建可能需要一些时间，完成后自动刷新页面…';
    }
    fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            session_id: SESSION_ID,
            direction: currentDirection,
            media_type: mediaType,
            call_id: currentCallId,
        }),
    })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(() => location.reload())
        .catch(err => {
            switchingMedia = false;
            if (status) status.textContent = '';
            document.querySelectorAll('#media-switch-banner button')
                .forEach(b => b.disabled = false);
            alert('追加分析失败：' + err.message);
        });
}

// 通话来源标注：这通通话出现在哪些上传抓包里。全部上传抓包都包含 → 绿色
// 说明“N 份抓包均有”；缺了抓包 → 黄色警示；只出现在一份抓包 → 红色醒目
// （其余抓包点没有这通电话的媒体流：可能是抓包时段不重叠，也可能是点对点
// 直连绕过了服务端）。uploads 为会话接口返回的上传文件列表（元素带 role）
function _callSourceBadges(c, uploads) {
    const roles = (uploads || []).map(f => f.role);
    const present = (c.files || []).map(f => ROLE_NAMES[f] || f);
    if (roles.length < 2) {
        return present.length
            ? `<span class="text-muted small">来源：${present.join(' / ')}</span>` : '';
    }
    const missing = (c.files_missing
        || roles.filter(r => !(c.files || []).includes(r)))
        .map(r => ROLE_NAMES[r] || r);
    if (!missing.length) {
        return `<span class="badge bg-success-subtle text-success-emphasis" ` +
            `title="这通通话的媒体流在上传的全部 ${roles.length} 份抓包里都出现了">` +
            `<i class="bi bi-check2-all"></i> ${roles.length} 份抓包均有（${present.join('、')}）</span>`;
    }
    if (present.length === 1) {
        const p2pNote = c.is_p2p
            ? `；该通话媒体为端到端直连，不经服务端，其余抓包没有它属正常现象`
            : '';
        return `<span class="badge bg-danger" title="这通通话只在上传的 1 份抓包里出现，` +
            `其余 ${missing.length} 份（${missing.join('、')}）没有它的媒体流——` +
            `可能是抓包时段与这通电话不重叠，或媒体/信令没有经过那些抓包点${p2pNote}">` +
            `<i class="bi bi-exclamation-triangle"></i> 仅见于 ${present[0]}</span>`;
    }
    return `<span class="badge bg-warning text-dark" title="这通通话只在 ` +
        `${present.join('、')}的抓包里出现，${missing.join('、')}的抓包里没有">` +
        `<i class="bi bi-files"></i> 见于 ${present.join('、')}</span>`;
}

function renderCalls(calls, captureWarning, uploads) {
    const card = document.getElementById('calls-card');
    const container = document.getElementById('calls-container');
    card.classList.remove('d-none');

    // FS 参与编解码判定的卡片徽章（后端 fs_media.verdict）：bypass 已由「点对
    // 点直连」表达，unknown 数据不足不给徽章（阶梯图里有灰字说明）
    const FS_MEDIA_BADGES = {
        transcode: '<span class="badge bg-danger"><i class="bi bi-shuffle"></i> 服务端转码（FS）</span>',
        same: '<span class="badge bg-success"><i class="bi bi-check2-circle"></i> 服务端未转码</span>',
    };
    // 折叠标题里的协商编码摘要：优先按腿展示（主叫 … / 被叫 …），与阶梯图的
    // 两行协商行、FS 转码判定一一对应；旧会话数据没有 per-leg 字段时回退为
    // 单份 negotiated_codecs（主叫腿汇总）
    const legSummary = leg => ['audio', 'video'].map(k =>
        leg[k]?.length ? `${k === 'audio' ? '音频' : '视频'} ${leg[k].join('/')}` : ''
    ).filter(Boolean).join('，');
    const npl = c => c.negotiated_per_leg || {};
    const legNegotiationSummary = c => {
        const parts = [];
        for (const [role, name] of [['caller', '主叫'], ['callee', '被叫']]) {
            if (!npl(c)[role]) continue;
            const t = legSummary(npl(c)[role]);
            if (t) parts.push(`${name} ${t}`);
        }
        if (parts.length) return parts.join(' / ');
        const t = legSummary(c.negotiated_codecs || {});
        return t ? `协商 ${t}` : '';
    };
    let html = captureWarning ? _captureWarningHtml(captureWarning) : '';
    calls.forEach(c => {
        const st = CALL_STATUS[c.completeness.status] || CALL_STATUS.complete;
        const flow = c.sip_flow || [];
        // 摘要行给出两腿各自协商的编码与 FS 媒体处理判定，不用展开
        const negTxt = legNegotiationSummary(c);
        const fmShort = {transcode: '服务端转码', same: '服务端未转码',
                         bypass: '媒体不经服务端'}[c.fs_media?.verdict] || '';

        let reasons = '';
        for (const [role, pf] of Object.entries(c.completeness.per_file || {})) {
            const pst = CALL_STATUS[pf.status] || CALL_STATUS.complete;
            reasons += `<div class="mb-1">
                <strong>${ROLE_NAMES[role] || role}</strong>
                <span class="badge ${pst.badge}">${pst.label}</span>
                <ul class="mb-0 text-muted ps-3">
                    ${(pf.reasons || []).map(r => `<li>${r}</li>`).join('')}
                </ul>
            </div>`;
        }

        html += `
        <div class="border rounded p-2 mb-2 bg-light">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <strong>${callLabel(c.call_id)}</strong>
                <span class="text-muted small">${c.start_str} ~ ${c.end_str}（${c.duration_s}s）</span>
                <span class="badge ${st.badge}"><i class="bi ${st.icon}"></i> ${st.label}</span>
                ${FS_MEDIA_BADGES[c.fs_media?.verdict] || ''}
                <span class="badge bg-light text-dark">${c.stream_count} 条流</span>
                ${_callSourceBadges(c, uploads)}
                ${_callPartyChain(flow)}
            </div>
            ${flow.length ? `<details open class="mt-1">
                <summary class="text-muted small" style="cursor:pointer">
                    SIP 信令流程（${_sipParties(flow).msgs.length} 条消息${negTxt ? ` · ${negTxt}` : ''}${fmShort ? ` · ${fmShort}` : ''}）
                </summary>
                <div class="mt-2 p-2 border rounded bg-white">
                    <div class="sip-flow">${_sipLadder(flow, c)}</div>
                </div>
            </details>` : ''}
            ${reasons ? `<details class="mt-1">
                <summary class="text-muted small" style="cursor:pointer">完整性判断依据</summary>
                <div class="mt-1">${reasons}</div>
            </details>` : ''}
        </div>`;
    });
    container.innerHTML = html;
}

// 回放条目的流展示标签，与 media_quality / 问题归属里的键同构
// （"fs (SSRC=0xeeb01cef)"），据此把质量结论与问题挂到对应播放器下
function _entryLabel(e) {
    const ssrc = String(e.ssrc || '').toLowerCase().replace(/^0x/, '').padStart(8, '0');
    return `${e.role || '?'} (SSRC=0x${ssrc})`;
}

// 媒体路径是否点对点（链路里去掉 FS）：无声诊断/延迟链路的 p2p 标记
function _mediaP2p(report) {
    return !!(report && ((report.audio_health && report.audio_health.p2p) ||
        (report.delay_chains && report.delay_chains.p2p)));
}

const MEDIA_KIND_META = {
    audio: { title: '音频', icon: 'bi-music-note-beamed', feelNoun: '听感' },
    video: { title: '视频', icon: 'bi-camera-video', feelNoun: '观感' },
};

function showMedia(manifest, report) {
    const card = document.getElementById('media-card');
    const container = document.getElementById('media-container');

    if (!manifest || (!manifest.audio?.length && !manifest.video?.length && !manifest.unsupported?.length)) {
        card.classList.add('d-none');
        return false;
    }
    card.classList.remove('d-none');
    report = report || {};

    let html = '';
    // 所属通话标注（分析限定在某通通话时）
    if (manifest.call_id) {
        html += `<div class="mb-2">
            <span class="badge bg-primary"><i class="bi bi-telephone"></i> ${manifest.call_id.replace('call_', '通话 ')}</span>
            <span class="text-muted small">以下媒体流均来自该通话</span>
        </div>`;
    }
    // 通话拓扑：先一句话说清每条腿谁到谁（主叫 ↔ FS ↔ 被叫，点对点时
    // 媒体不经 FS、链路里去掉 FS），细节在每条流开头标注
    const parties = manifest.parties || [];
    if (parties.length) {
        html += `<div class="mb-3 small d-flex flex-wrap align-items-center gap-1">` +
            `<i class="bi bi-diagram-3 text-primary"></i>` +
            parties.map(p => _partyChainHtml(p, _mediaP2p(report))).join('<span class="text-muted mx-1">；</span>') +
            `<span class="text-muted ms-1">—— 每条媒体流的收发双方与抓包来源标注在各流开头；同一方向内先列服务端抓包的段，其余按三段式链路顺序排列</span></div>`;
    }
    // 音频/视频各一个子区块：按链路方向分组（点对点时组头链路无 FS），
    // 每个播放器卡片下面直接挂该流的质量结论与问题——听音频时即可对号入座
    ['audio', 'video'].forEach(kind => {
        const entries = manifest[kind] || [];
        if (!entries.length) return;
        const pc = kind === 'audio' ? report.problem_classification
                                    : report.video_problem_classification;
        const meta = MEDIA_KIND_META[kind];
        const mq = (report.media_quality || {})[kind] || {};
        const labels = entries.map(_entryLabel);
        const byLabel = {};
        entries.forEach(e => { byLabel[_entryLabel(e)] = e; });
        // 每条流的真实收发双方（flow）用于把上行/下行两条腿拼成完整链路方向
        const serverIp = (manifest.parties && manifest.parties[0] &&
                          manifest.parties[0].server_ip) || null;
        const groups = _buildDirGroups(labels, report, kind, _mediaP2p(report),
                                       lb => (byLabel[lb] || {}).flow, serverIp);
        // 每个链路方向一张卡（"谁到谁"），按"主叫 → 被叫"在前排序；
        // 归不了链路的组（其他流 / FS 转发）放在最后
        const chain = groups.filter(g => g.label && !g.rest && !g.fsRelay)
            .sort((a, b) => ((b.speaker || '').startsWith('主叫') ? 1 : 0) -
                            ((a.speaker || '').startsWith('主叫') ? 1 : 0));
        const others = groups.filter(g => !(g.label && !g.rest && !g.fsRelay));
        const renderGroups = [...chain, ...others];
        // 同一方向卡内播放卡片的排序：服务端抓包的段全部最前，其余按三段式
        // 链路位置排——上游腿（说话方 → 服务端）在前、下游腿（服务端 → 收听方）
        // 在后。抓包点角色对上本卡的说话方即上游腿（如 主叫侧抓包的主叫→FS、
        // 被叫侧抓包的被叫→FS），对上收听方即下游腿；服务端抓包收（上游）在
        // 前、发（下游）在后
        const capSrcRank = lb => ((byLabel[lb] || {}).role === 'fs' ? 0 : 1);
        const _legRank = (lb, g) => {
            const e = byLabel[lb] || {};
            if (e.role === 'fs') return e.direction === 'outbound' ? 1 : 0;
            const roleOf = { terminal: '主叫', seat: '被叫' }[e.role];
            if (roleOf && roleOf === g.speaker) return 0;
            if (roleOf && roleOf === g.listener) return 1;
            return e.direction === 'inbound' ? 1 : 0;   // 角色未知：发送端视为上游腿
        };
        renderGroups.forEach(g => {
            g.labels = [...g.labels].sort((a, b) =>
                (capSrcRank(a) - capSrcRank(b)) ||
                (_legRank(a, g) - _legRank(b, g)) ||
                String((byLabel[a] || {}).ssrc || '')
                    .localeCompare(String((byLabel[b] || {}).ssrc || '')));
        });
        const globalProblems = pc ? _attributeProblems(pc, renderGroups) : [];

        html += `<h6 class="mt-3 mb-2"><i class="bi ${meta.icon} text-primary"></i> ${meta.title}` +
            ` <span class="badge bg-light text-dark">${entries.length} 个媒体流</span></h6>`;
        if (pc && pc.summary) {
            html += `<div class="alert alert-secondary py-2 small mb-2">${_esc(pc.summary)}</div>`;
        }
        // 整体容器：本媒体类型下所有"谁到谁"的方向卡片都包在这个框里
        // （浅灰底 + 内层白卡，让"大卡包两张方向卡"的层级一眼可见）
        html += '<div class="border rounded p-2 mb-3 bg-body-tertiary">';
        renderGroups.forEach(g => {
            html += '<div class="bg-body border rounded p-2 mb-2">';
            html += _dirGroupHead(g, mq, kind, meta.feelNoun);
            if (g.labels.length) {
                html += '<div class="row g-2 mt-1">' + g.labels.map(lb =>
                    _mediaItem(byLabel[lb], kind, mq[lb] || {},
                               (g.streamProblems || {})[lb], meta.feelNoun, serverIp)
                ).join('') + '</div>';
            }
            // 音频方向卡尾部：无声诊断逐腿检查 / 分段延迟明细（原来是与卡头
