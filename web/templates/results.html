            // 重复链路头的独立区块，现折叠进卡里，整页每条链路只出现一次）
            if (kind === 'audio' && (g.ah || g.dc)) {
                html += '<details class="mt-1"><summary class="small text-muted user-select-none">' +
                    '无声诊断逐腿检查 / 分段延迟明细（点开展开查看）</summary>';
                if (g.ah) {
                    html += '<div class="small mt-1"><strong>无声诊断（' +
                        _esc(g.ah.verdict_text || '') + '）</strong></div>' + _audioLegsHtml(g.ah);
                }
                if (g.dc) {
                    html += '<div class="small mt-2"><strong>分段延迟链路</strong>' +
                        (g.dc.total_mean != null ? `（合计 ${g.dc.total_mean}ms）` : '') +
                        '</div>' + _delayTableHtml(g.dc);
                }
                html += '</details>';
            }
            html += '</div>';
        });
        html += '</div>';
        if (pc) html += _mediaSectionFooter(pc, globalProblems, meta.feelNoun);
    });

    if (manifest.unsupported && manifest.unsupported.length > 0) {
        html += '<div class="alert alert-warning small mt-2"><strong>未能重建的流：</strong><ul class="mb-0">';
        manifest.unsupported.forEach(u => {
            const flow = u.flow ? `（${_esc(u.flow.from.label)} → ${_esc(u.flow.to.label)}）` : '';
            html += `<li>${ROLE_NAMES[u.role] || u.role} (SSRC=${u.ssrc})${flow} — ${u.codec}: ${u.reason}</li>`;
        });
        html += '</ul></div>';
    }

    container.innerHTML = html;
    return true;
}

// 通话拓扑链：主叫 ↔ 服务端 ↔ 被叫（各端称呼 + IP），来自后端 SIP 信令识别；
// 媒体点对点（p2p）时中间的服务端不展示——信令虽经服务端，媒体却是两端直连
function _partyChainHtml(p, p2p) {
    const seg = s => s ? `<strong>${_esc(s.label || '')}</strong>` +
        (s.ip ? `<span class="text-muted ms-1">${s.ip}</span>` : '') : '';
    const arrow = p2p
        ? ` <i class="bi bi-arrow-left-right text-muted mx-1"></i> `
        : ` <i class="bi bi-arrow-left-right text-muted mx-1"></i> ` +
          `<span class="badge bg-dark">服务端</span>` +
          (p.server_ip ? `<span class="text-muted ms-1">${p.server_ip}</span>` : '');
    let html = seg(p.caller);
    html += arrow;
    if (p.answerer) {
        html += seg(p.answerer);
    }
    return html;
}

// 回放卡片：播放器在上，下面直接挂该流的质量结论徽章、关键指标与问题——
// 听音频/看画面时即可对号入座；有严重问题时卡片左侧红线强调
function _mediaItem(entry, kind, q, problems, feelNoun, serverIp) {
    const dirName = DIR_NAMES[entry.direction] || entry.direction;
    const dirBadge = DIR_BADGE[entry.direction] || 'bg-secondary';
    const dur = entry.duration_ms ? (entry.duration_ms / 1000).toFixed(1) + 's' : '';

    // 每条流统一标两段式实际流向："主叫 → 服务端" / "服务端 → 被叫"，
    // 点对点或拓扑对不上时退回收发双方角色（"主叫 → 被叫"）
    let head = `<span class="badge ${dirBadge} me-1">${dirName}</span>`;
    if (entry.flow && entry.flow.from && entry.flow.to) {
        const fi = entry.flow.from.ip, ti = entry.flow.to.ip;
        let leg;
        if (serverIp && fi === serverIp) leg = `服务端 → ${_shortParty(entry.flow.to.label)}`;
        else if (serverIp && ti === serverIp) leg = `${_shortParty(entry.flow.from.label)} → 服务端`;
        else leg = `${_shortParty(entry.flow.from.label)} → ${_shortParty(entry.flow.to.label)}`;
        head += `<span class="badge bg-light text-dark border me-1">${_esc(leg)}</span>`;
    }
    // 抓包来源：这段音/视频从哪份上传的抓包里重建（同一条流多份抓包各出一段）
    if (entry.role) {
        const srcName = CAPTURE_SOURCE_NAMES[entry.role] || `${entry.role} 抓包`;
        head += `<span class="badge bg-info-subtle text-info-emphasis border border-info-subtle me-1"` +
            ` title="此音/视频从该份上传的抓包中重建">来源：${_esc(srcName)}</span>`;
    }
    // 质量结论徽章跟在头部，一眼可见这条流有没有问题
    let verdictBadge = '';
    if (q && q.verdict) {
        const badge = QUALITY_BADGES[q.verdict] ||
            ['secondary', q.verdict === 'unknown' ? '无法判定' : q.verdict];
        verdictBadge = `<span class="badge bg-${badge[0]}">${_esc(badge[1])}</span>`;
    }

    let meta = `<span class="badge bg-dark me-1">${entry.codec || ''}</span>
                <span class="text-muted small">SSRC: ${entry.ssrc}`;
    if (dur) meta += ` · 时长 ${dur}`;
    if (entry.total_packets) meta += ` · ${entry.total_packets} 包`;
    if (entry.lost_packets) meta += ` · 丢 ${entry.lost_packets} 包`;
    meta += '</span>';

    let player;
    if (kind === 'audio') {
        player = `<audio controls preload="none" class="w-100 mt-1">
                    <source src="${entry.url}" type="audio/wav">
                    您的浏览器不支持音频播放。
                  </audio>`;
    } else {
        player = `<video controls preload="metadata" class="w-100 mt-1" style="max-height: 300px;">
                    <source src="${entry.url}" type="${entry.mp4_available ? 'video/mp4' : 'video/h264'}">
                    您的浏览器不支持视频播放。
                  </video>`;
    }

    // 关键指标 chips（原"流质量速览"行，现挂在播放器下方）
    let chipsHtml = '';
    if (q && q.verdict) {
        const chips = kind === 'video' ? _videoQualityChips(q) : _audioQualityChips(q);
        chipsHtml = '<div class="mt-1">' + chips.map(c =>
            `<span class="badge bg-light text-dark border me-1 mb-1 fw-normal">${_esc(c)}</span>`
        ).join('') + '</div>';
    }

    const bad = (problems || []).some(_isSevere);
    return `
        <div class="col-md-6"><div class="stream-card border rounded p-2 h-100${bad ? ' stream-card-bad' : ''}">
            <div class="d-flex flex-wrap align-items-center gap-1">${head}${verdictBadge}</div>
            <div class="mt-1">${meta}</div>
            ${player}
            ${chipsHtml}
            ${_problemList(problems, feelNoun)}
            <a href="${entry.url}" download class="btn btn-sm btn-outline-secondary mt-1">
                <i class="bi bi-download"></i> 下载
            </a>
        </div></div>
    `;
}
</script>
{% endblock %}
